[package]
name = "cloudflare-cname-switcher"
version = "2.2.18"
edition = "2024"

[profile.release]
strip = true
lto = true

[dependencies]
hyper = { version = "1.11.0", features = ["client", "http1", "server"] }
tokio = { version = "1.53.1", features = ["full"] }
notify = "8.2.0"
prometheus = "0.14.0"
rustdns = "0.4.0"
rand = "0.10.2"
env_logger = "0.11.11"
log = "0.4.33"
hyper-util = { version = "0.1.20", features = ["tokio"] }
http-body-util = "0.1.4"
bytes = "1.12.1"
tokio-rustls = "0.26.4"
webpki-roots = "1.0.9"
rustls-pki-types = "1.15.1"
serde = "1.0.229"
serde_json = "1.0.151"
chrono = "0.4.45"
itertools = "0.15.0"
yaml-rust = "0.4.5"
